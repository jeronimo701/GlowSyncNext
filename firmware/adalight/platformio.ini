[platformio]
default_envs = uno, esp32

[env]
framework = arduino
lib_deps = fastled/FastLED@3.9.15
monitor_speed = 115200
build_flags = -D LED_COUNT=81 -D SERIAL_BAUD=115200 -D MAX_MILLIAMPS=1500

[env:uno]
platform = atmelavr@5.1.0
board = uno
build_flags = ${env.build_flags} -D GS_DATA_PIN=6

[env:esp32]
platform = espressif32@6.10.0
board = esp32dev
build_flags = ${env.build_flags} -D GS_DATA_PIN=18
